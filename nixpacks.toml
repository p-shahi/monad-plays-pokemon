[phases.setup]
nixPkgs = ["nodejs_24"]
nixpkgsArchive = "23f9169c4ccce521379e602cc82ed873a1f1b52b"

[phases.install]
cmds = [
  "cd frontend && npm install",
  "cd indexer && npm install"
]

[phases.build]
cmds = [
  "cd frontend && npm run build",
  "cd indexer && npm run build"
]

[start]
cmd = "cd indexer && npm start"
